[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rindex"
version = "0.1.0"
description = "Plataforma de inteligencia de brechas de rendimiento agricola para Colombia"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pandera>=0.20.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "scipy>=1.12.0",
    "shapely>=2.2.0",
    "topojson>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline/rindex"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["pipeline", "pruebas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["pipeline", "pruebas"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
